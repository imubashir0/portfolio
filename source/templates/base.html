<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101719">
  <meta name="description" content="$description">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:; font-src 'self'; form-action 'none'">
  <title>$title</title>
  <link rel="canonical" href="$canonical">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Mubashir Ishimwe">
  <meta property="og:title" content="$title">
  <meta property="og:description" content="$description">
  <meta property="og:url" content="$canonical">
  <meta property="og:image" content="$social_image">
  <meta property="og:image:alt" content="$social_alt">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="${root}assets/images/terminal.svg" type="image/svg+xml">
  <link rel="manifest" href="${root}site.webmanifest">
  <link rel="preload" href="${root}assets/fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="${root}assets/css/styles.css">
  <script src="${root}assets/js/site.js" defer></script>
</head>
<body id="top" class="$page_class">
  <a class="skip-link" href="#main">Skip to content</a>
  $header
  $content
  $footer
</body>
</html>
